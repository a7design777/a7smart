name: build

# Збірка йде в CI, а не на сервері: 1 vCPU поруч із n8n/flowise/a7cms
# не має ресурсу на docker build.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Помилка типів має падати тут, а не в продакшні.
      - run: npm run typecheck

      - run: npm run build

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/a7smart:latest
            ghcr.io/${{ github.repository_owner }}/a7smart:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
