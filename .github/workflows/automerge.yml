# Автоматичний мердж робочої гілки в main після зелених перевірок.
# Раніше кожен пуш вимагав ручного мерджу PR на GitHub — тепер прод
# оновлюється сам, як тільки код у гілці пройшов типчек/лінт/білд.
name: automerge

on:
  push:
    branches: [claude/neon-fancoil-dashboard-review-274f5d]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  merge:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fast-forward main
        # Повідомлення коміту — лише через env: підстановка ${{ }} прямо в
        # скрипт ламалась на лапках/бектиках у тексті коміту.
        env:
          BRANCH: ${{ github.ref_name }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git merge --no-ff "origin/$BRANCH" -m "Auto-merge $BRANCH: $COMMIT_MSG"
          git push origin main

      # Пуш від GITHUB_TOKEN не запускає інші workflow — збірку образу
      # запускаємо явно, інакше сервер лишається на старому образі.
      - name: Build image
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build --ref main
