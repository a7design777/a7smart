# Автоматичний мердж робочої гілки в main після зелених перевірок.
# Раніше кожен пуш вимагав ручного мерджу PR на GitHub — тепер прод
# оновлюється сам, як тільки код у гілці пройшов типчек/лінт/білд.
name: automerge

on:
  push:
    branches: [claude/neon-fancoil-dashboard-review-274f5d]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  merge:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fast-forward main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git merge --no-ff "origin/${{ github.ref_name }}" \
            -m "Auto-merge ${{ github.ref_name }}: ${{ github.event.head_commit.message }}"
          git push origin main
